name: Android Preview APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Trigger EAS Android preview build
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Trigger Android APK build
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
