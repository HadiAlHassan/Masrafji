name: OTA Update

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ota-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish EAS Update to preview channel
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Resolve commit message
        id: gate
        run: |
          commit_message="$(git log -1 --pretty=%s)"
          echo "message=$commit_message" >> "$GITHUB_OUTPUT"
          echo "Publishing OTA update: $commit_message"

      - name: Publish update
        run: |
          npx eas-cli@latest update \
            --branch preview \
            --message "ota: ${{ steps.gate.outputs.message }} (${{ github.sha }})" \
            --non-interactive
